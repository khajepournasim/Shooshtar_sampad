<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مشاور | سمپاد شوشتر</title><link rel="stylesheet" href="assets/site.css"></head><body class="admin-page"><header class="panel-nav"><div class="wrap"><div class="panel-brand"><img src="assets/sampad-logo.png"><strong>پنل مشاور<br><span>صدای مشاور</span></strong></div><a class="logout" href="index.html">سایت اصلی</a></div></header><main class="wrap admin-main"><div class="manage-card"><div class="field"><label>کلید مدیریت/مشاور</label><input id="adminKey" type="password" placeholder="ADMIN_KEY را وارد کنید"></div></div><div class="admin-head"><div><span class="eyebrow" style="background:#eaf5ff;color:#0b5ea8;border-color:#cfe6f5">مشاوره تحصیلی و کنکور</span><h1>صدای مشاور</h1></div></div><section class="manage-card"><h2>🎧 پیام‌های صوتی</h2><p style="font-size:9px;color:var(--muted)">فایل‌های صوتی پس از اتصال Backend و ذخیره‌سازی، از این بخش برای دانش‌آموزان منتشر می‌شوند.</p><div class="counsel-audio"><span>🎧</span><audio controls preload="none"><source src="uploads/counselor/latest.mp3" type="audio/mpeg"></audio></div><div class="upload-box" style="margin-top:12px"><input type="file" id="audio" accept="audio/*"><button class="btn gold" onclick="uploadAudio()">بارگذاری ویس</button><span class="result" id="audioResult"></span></div></section></main><script>document.getElementById('adminKey').value=localStorage.getItem('adminKey')||'';document.getElementById('adminKey').addEventListener('input',e=>localStorage.setItem('adminKey',e.target.value));async function uploadAudio(){const f=document.getElementById('audio').files[0],o=document.getElementById('audioResult');if(!f){o.textContent='یک فایل صوتی انتخاب کنید.';return}const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/counselor/audio',{method:'POST',headers:{'x-admin-key':localStorage.getItem('adminKey')||''},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');o.textContent='ویس با موفقیت ثبت شد.'}catch(e){o.textContent=e.message}}</script></body></html>
