<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گالری فعالیت‌ها | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"><style>
.gallery-page{min-height:100vh;background:#020b14}.gallery-hero{padding:70px 0 45px;background:radial-gradient(circle at 50% 0,rgba(217,166,58,.12),transparent 35%);text-align:center}.gallery-hero h1{font-size:36px;margin:10px 0}.gallery-hero p{color:#9eabb2;font-size:11px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:30px 0 70px}.gallery-item{background:#06131f;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}.gallery-item img{width:100%;height:280px;object-fit:cover;display:block}.gallery-item h3{font-size:12px;margin:0;padding:14px}.back{color:var(--gold2);font-size:10px;text-decoration:none}.viewer{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}.viewer.open{display:flex}.viewer img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:12px}.close{position:absolute;top:20px;left:25px;color:#fff;font-size:35px;cursor:pointer}@media(max-width:800px){.gallery-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.gallery-grid{grid-template-columns:1fr}}
</style></head><body class="gallery-page"><div class="gallery-hero"><div class="wrap"><a class="back" href="index.html">← بازگشت به صفحه اصلی</a><h1>گالری فعالیت‌های مدرسه</h1><p>تصاویر مدرسه، برنامه‌ها و فعالیت‌های دبیرستان استعدادهای درخشان شوشتر</p></div></div><main class="wrap gallery-grid">
<div class="gallery-item" onclick="show(this)"><img src="Assets/school-gate.jpg" alt="ورودی مدرسه"><h3>ورودی دبیرستان</h3></div>
<div class="gallery-item" onclick="show(this)"><img src="Assets/school-front.jpg" alt="نمای مدرسه"><h3>نمای مدرسه</h3></div>
<div class="gallery-item" onclick="show(this)"><img src="Assets/school-building.jpg" alt="حیاط و ساختمان"><h3>ساختمان دبیرستان</h3></div>
<div class="gallery-item" onclick="show(this)"><img src="Assets/Assets/Misaghname.jpg_972.jpg" alt="اطلاعیه دانش‌آموزان"><h3>اطلاعیه دانش‌آموزان</h3></div>
<div class="gallery-item" onclick="show(this)"><img src="Assets/pishkhan-dahom.jpg" alt="کلاس‌های پیشخوان"><h3>کلاس‌های پیشخوان پایه دهم</h3></div>
<div class="gallery-item" onclick="show(this)"><img src="Assets/taahodname.jpg" alt="تعهدنامه"><h3>تعهدنامه پذیرش شرایط ادامه تحصیل</h3></div>
</main><div class="viewer" id="viewer" onclick="closeViewer(event)"><span class="close">×</span><img id="big" src="" alt=""></div><script>function show(el){document.getElementById("big").src=el.querySelector("img").src;document.getElementById("viewer").classList.add("open")}function closeViewer(e){if(e.target.id==="viewer"||e.target.classList.contains("close"))document.getElementById("viewer").classList.remove("open")}</script></body></html>
