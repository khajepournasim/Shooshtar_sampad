<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گالری فعالیت‌های دبیرستان</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f8f5ed;
  color:#172b4d;
}

header{
  background:linear-gradient(135deg,#071b36,#173e68);
  color:white;
  text-align:center;
  padding:35px 15px;
}

header h1{
  margin:0 0 10px;
  font-size:28px;
}

header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:35px 15px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.photo{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.10);
  cursor:pointer;
  transition:.2s;
}

.photo:hover{
  transform:translateY(-4px);
}

.photo img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.photo h3{
  margin:0;
  padding:14px;
  text-align:center;
  font-size:16px;
}

.back{
  display:inline-block;
  margin-bottom:25px;
  padding:10px 18px;
  background:#173e68;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

#viewer{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.9);
  align-items:center;
  justify-content:center;
  padding:20px;
}

#viewer img{
  max-width:95%;
  max-height:90%;
  border-radius:10px;
}

#close{
  position:absolute;
  top:15px;
  left:20px;
  color:white;
  font-size:35px;
  cursor:pointer;
}

@media(max-width:600px){
  header h1{
    font-size:23px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .photo img{
    height:140px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📸 گالری فعالیت‌های مدرسه</h1>
  <p>دبیرستان استعدادهای درخشان دوره دوم شوشتر</p>
</header>

<div class="container">

<a class="back" href="index.html">← بازگشت به صفحه اصلی</a>

<div class="gallery">

  <!-- عکس‌های فعالیت‌ها را از اینجا اضافه می‌کنیم -->

  <div class="photo" onclick="showImage('misaghname.jpg')">
    <img src="misaghname.jpg" alt="میثاق‌نامه دانش‌آموزان">
    <h3>میثاق‌نامه دانش‌آموزان</h3>
  </div>

  <div class="photo" onclick="showImage('taahodname.jpg')">
    <img src="taahodname.jpg" alt="تعهدنامه دانش‌آموزان">
    <h3>تعهدنامه دانش‌آموزان</h3>
  </div>

</div>

</div>

<div id="viewer" onclick="closeImage()">
  <span id="close">×</span>
  <img id="bigImage" src="" alt="">
</div>

<script>
function showImage(src){
  document.getElementById("bigImage").src=src;
  document.getElementById("viewer").style.display="flex";
}

function closeImage(){
  document.getElementById("viewer").style.display="none";
}
</script>

</body>
  </html>
