      href="Assets/site.css">

<style>

:root{
    --navy:#063b5c;
    --blue:#0879aa;
    --blue2:#0c91bd;
    --gold:#d7a62a;
    --gold-light:#f5df91;
    --text:#173c51;
    --muted:#748791;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body.panel-shell{

    margin:0;
    min-height:100vh;

    font-family:
        Sahel,
        Tahoma,
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 8% 15%,
            rgba(215,166,42,.09),
            transparent 180px
        ),
        radial-gradient(
            circle at 92% 35%,
            rgba(8,121,170,.08),
            transparent 210px
        ),
        linear-gradient(
            135deg,
            #f9fcfd,
            #edf5f8
        );

    overflow-x:hidden;
}


/* برگ‌های متحرک */

.vine{
    position:fixed;
    z-index:0;
    pointer-events:none;
    opacity:.12;
    color:var(--gold);
    font-size:70px;

    animation:
        vineMove
        10s
        ease-in-out
        infinite;
}

.vine.one{
    right:-15px;
    top:150px;
    transform:rotate(20deg);
}

.vine.two{
    left:-20px;
    bottom:100px;
    color:var(--blue);
    font-size:95px;
    animation-delay:2s;
}

.vine.three{
    right:12%;
    bottom:4%;
    font-size:45px;
    opacity:.07;
    animation-delay:4s;
}

@keyframes vineMove{

    0%,100%{
        transform:
            translateY(0)
            rotate(15deg);
    }

    50%{
        transform:
            translateY(-18px)
            rotate(25deg);
    }
}


/* ذرات شناور */

.particle{

    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--gold);

    opacity:.15;

    pointer-events:none;

    animation:
        particleFloat
        8s
        ease-in-out
        infinite;

    z-index:0;
}

.p1{
    right:20%;
    top:30%;
}

.p2{
    right:70%;
    top:60%;
    animation-delay:2s;
}

.p3{
    right:40%;
    top:15%;
    animation-delay:4s;
}

@keyframes particleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-30px);
    }
}


/* هدر */

.panel-nav{

    position:relative;
    z-index:20;

    background:
        rgba(255,255,255,.88);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(6,59,92,.08);

    box-shadow:
        0 10px 35px
        rgba(6,59,92,.07);
}

.panel-nav .wrap{

    width:
        min(1180px,92%);

    min-height:82px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}


/* برند */

.panel-brand{

    display:flex;

    align-items:center;

    gap:15px;
}

.logo-box{

    width:58px;
    height:58px;

    display:grid;

    place-items:center;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            var(--navy),
            var(--blue)
        );

    border:
        1px solid
        rgba(215,166,42,.7);

    box-shadow:
        0 10px 30px
        rgba(6,59,92,.2),
        0 0 0 5px
        rgba(215,166,42,.05);

    animation:
        logoFloat
        4s
        ease-in-out
        infinite;
}

.logo-box img{

    width:42px;
    height:42px;

    object-fit:contain;
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}

.panel-title{

    font-weight:800;

    color:var(--navy);

    font-size:17px;

    line-height:1.7;
}

.panel-title small{

    display:block;

    font-size:10px;

    color:#788a94;

    font-weight:400;
}


/* خروج */

.logout{

    border:
        1px solid
        rgba(215,166,42,.45);

    background:
        linear-gradient(
            135deg,
            #fffaf0,
            #fff2c7
        );

    color:#76580a;

    padding:10px 18px;

    border-radius:14px;

    font-family:inherit;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.logout:hover{

    transform:translateY(-3px);

    box-shadow:
        0 12px 28px
        rgba(215,166,42,.18);
}

<script src="Assets/config.js"></script>

<script>

/* ==========================================
   تنظیمات API
========================================== */

const API =
    (window.SITE_CONFIG?.API_BASE || "")
    .replace(/\/$/, "");


/* ==========================================
   توکن دانش‌آموز
========================================== */

const token =
    localStorage.getItem("studentToken");


/* ==========================================
   اگر وارد نشده باشد
========================================== */

if (!token) {

    window.location.href =
        "student-login.html";

}


/* ==========================================
   خروج
========================================== */

function logout() {

    localStorage.removeItem(
        "studentToken"
    );

    window.location.href =
        "student-login.html";

}


/* ==========================================
   تبدیل اعداد به فارسی
========================================== */

function fa(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "—";

    }

    return String(value).replace(
        /\d/g,
        function(d) {
            return "۰۱۲۳۴۵۶۷۸۹"[d];
        }
    );

}


/* ==========================================
   جلوگیری از خراب شدن آرایه‌ها
========================================== */

function safeArray(value) {

    return Array.isArray(value)
        ? value
        : [];

}


/* ==========================================
   دریافت اطلاعات پنل
========================================== */

async function loadDashboard() {

    try {

        const response =
            await fetch(
                API + "/api/student/dashboard",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "خطا در دریافت اطلاعات"
            );

        }


        /* ================================
           اطلاعات دانش‌آموز
        ================================= */

        const student =
            data.student || {};


        const firstName =
            student.first_name || "";


        const lastName =
            student.last_name || "";


        document.getElementById(
            "welcomeName"
        ).textContent =
            `سلام، ${firstName} ${lastName} 👋`;


        document.getElementById(
            "studentMeta"
        ).textContent =
            `پایه ${student.grade || "—"} | رشته ${student.field || "—"} | کلاس ${student.class_name || "—"}`;


        document.getElementById(
            "avatar"
        ).textContent =
            firstName
                ? firstName.charAt(0)
                : "د";


        /* ================================
           آمار آموزشی
        ================================= */

        document.getElementById(
            "average"
        ).textContent =
            fa(data.average);


        document.getElementById(
            "rank"
        ).textContent =
            data.rank
                ? `${fa(data.rank)} از ${fa(data.classSize)}`
                : "—";


        document.getElementById(
            "classSize"
        ).textContent =
            fa(data.classSize);


        document.getElementById(
            "classAverage"
        ).textContent =
            fa(data.classAverage);


        /* ================================
           کلاس‌ها
        ================================= */

        const classes =
            safeArray(data.classes);


        document.getElementById(
            "classList"
        ).innerHTML = classes.length

            ? classes.map(function(x) {

                return `
                    <li>

                        <b>
                            ${x.title || "کلاس"}
                        </b>

                        <span>
                            ${x.teacher || "—"}
                        </span>

                    </li>
                `;

            }).join("")

            : `
                <li class="empty-row">
                    کلاسی ثبت نشده است.
                </li>
            `;


        /* ================================
           نمرات
        ================================= */

        const grades =
            safeArray(data.grades);


        document.getElementById(
            "gradeList"
        ).innerHTML = grades.length

            ? grades.map(function(x) {

                return `
                    <li>

                        <b>
                            ${x.subject || "درس"}
                        </b>

                        <span class="score">
                            ${fa(x.score)}
                        </span>

                    </li>
                `;

            }).join("")

            : `
                <li class="empty-row">
                    هنوز نمره‌ای ثبت نشده است.
                </li>
            `;


        /* ================================
           امتحانات
        ================================= */

        const exams =
            safeArray(data.exams);


        document.getElementById(
            "examList"
        ).innerHTML = exams.length

            ? exams.map(function(x) {

                return `
                    <li>

                        <b>
                            ${x.subject || "امتحان"}
                        </b>

                        <span>
                            ${x.exam_date || "—"}
                        </span>

                    </li>
                `;

            }).join("")

            : `
                <li class="empty-row">
                    امتحانی ثبت نشده است.
                </li>
            `;


        /* ================================
           رضایت‌نامه‌ها
        ================================= */

        const consents =
            safeArray(data.consents);


        document.getElementById(
            "consentList"
        ).innerHTML = consents.length

            ? consents.map(function(x) {

                const done =
                    x.status === "done";


                return `
                    <li>

                        <b>
                            ${x.title || "رضایت‌نامه"}
                        </b>

                        <span class="status ${
                            done
                                ? "status-done"
                                : "status-pending"
                        }">

                            ${
                                done
                                    ? "✓ تکمیل شده"
                                    : "در انتظار"
                            }

                        </span>

                    </li>
                `;

            }).join("")

            : `
                <li class="empty-row">
                    رضایت‌نامه‌ای وجود ندارد.
                </li>
            `;


        /* ================================
           اطلاعیه‌ها
        ================================= */

        const announcements =
            safeArray(data.announcements);


        document.getElementById(
            "announcementList"
        ).innerHTML =
            announcements.length

            ? announcements.map(function(x) {

                return `
                    <li>

                        <b>
                            ${x.title || "اطلاعیه"}
                        </b>

                        <span>
                            🔔
                        </span>

                    </li>
                `;

            }).join("")

            : `
                <li class="empty-row">
                    اطلاعیه جدیدی نیست.
                </li>
            `;


        /* ================================
           فایل‌ها
        ================================= */

        const files =
            safeArray(data.files);


        if (files.length) {

            document.getElementById(
                "fileList"
            ).innerHTML = files.map(function(file) {

                return `
                    <a
                        class="student-file"
                        href="${file.url || "#"}"
                        target="_blank"
                        rel="noopener"
                    >

                        <span>
                            📄
                        </span>

                        <strong>
                            ${file.title || "فایل دانش‌آموز"}
                        </strong>

                    </a>
                `;

            }).join("");

        }


        /* ================================
           صدای مشاور
        ================================= */

        if (data.counselorAudio) {

            const audio =
                document.getElementById(
                    "counselorAudio"
                );


            audio.src =
                API + data.counselorAudio;


            audio.style.display =
                "block";


            document.getElementById(
                "audioEmpty"
            ).style.display =
                "none";

        }


    } catch (error) {

        console.error(
            "Student Panel Error:",
            error
        );


        document.getElementById(
            "welcomeName"
        ).textContent =
            "پنل دانش‌آموزی";


        document.getElementById(
            "studentMeta"
        ).textContent =
            "اطلاعات شما در حال آماده‌سازی است.";

    }

}


/* ==========================================
   اجرای پنل
========================================== */

if (token) {

    loadDashboard();

}

</script>

</body>

    height:43px;
    object-fit:contain;
}


@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }

}


.brand-text{
    display:flex;
    flex-direction:column;
    gap:2px;
}


.brand-text strong{
    color:#063b5c;
    font-size:18px;
}


.brand-text span{
    color:#71828c;
    font-size:10px;
}


/* ==========================================
   دکمه خروج
========================================== */

.logout-btn{
    border:1px solid rgba(215,166,42,.45);

    background:
        linear-gradient(
            135deg,
            #fffaf0,
            #fff2c7
        );

    color:#765b12;

    border-radius:15px;

    padding:11px 20px;

    font-family:inherit;
    font-weight:700;

    cursor:pointer;

    transition:.35s;
}


.logout-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 28px
        rgba(215,166,42,.18);
}


/* ==========================================
   محتوای اصلی
========================================== */

.main-content{
    position:relative;
    z-index:2;

    padding:
        42px 0 70px;
}


/* ==========================================
   کارت خوش‌آمدگویی
========================================== */

.welcome-card{
    position:relative;

    min-height:210px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:32px;

    border-radius:32px;

    background:
        linear-gradient(
            135deg,
            #063b5c 0%,
            #0879aa 55%,
            #0c7195 100%
        );

    color:white;

    box-shadow:
        0 25px 60px
        rgba(6,59,92,.22);
}


/* نور متحرک */

.welcome-card::after{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    left:-100px;
    top:-150px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        0 0 0 30px rgba(255,255,255,.025),
        0 0 0 60px rgba(255,255,255,.018);

    animation:
        welcomeOrbit
        16s
        linear
        infinite;
}


@keyframes welcomeOrbit{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


.welcome-glow{
    position:absolute;

    width:180px;
    height:180px;

    right:20%;
    top:-100px;

    border-radius:50%;

    background:
        rgba(242,215,125,.12);

    filter:blur(5px);

    animation:
        glowMove
        7s
        ease-in-out
        infinite;
}


@keyframes glowMove{

    0%,100%{
        transform:
            translate(0,0)
            scale(1);
    }

    50%{
        transform:
            translate(50px,30px)
            scale(1.25);
    }

}


/* ==========================================
   محتوای خوش‌آمدگویی
========================================== */

.welcome-content{
    position:relative;
    z-index:5;

    display:flex;
    align-items:center;

    gap:22px;
}


.student-avatar{
    width:92px;
    height:92px;

    flex:0 0 92px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.22),
            rgba(255,255,255,.07)
        );

    border:
        2px solid
        #f2d77d;

    color:#f2d77d;

    font-size:38px;
    font-weight:800;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.15),

        inset 0 0 25px
        rgba(255,255,255,.08);

    animation:
        avatarPulse
        5s
        ease-in-out
        infinite;
}


@keyframes avatarPulse{

    0%,100%{
        box-shadow:
            0 12px 30px rgba(0,0,0,.15),
            0 0 0 0 rgba(242,215,125,.12);
    }

    50%{
        box-shadow:
            0 15px 35px rgba(0,0,0,.18),
            0 0 0 12px rgba(242,215,125,.04);
    }

}


.welcome-label{
    display:inline-block;

    padding:5px 11px;

    margin-bottom:6px;

    border-radius:20px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.14);

    color:#f2d77d;

    font-size:10px;
}


.welcome-text h1{
    margin:0;

    font-size:29px;

    line-height:1.8;

    color:white;
}


.welcome-text p{
    margin:5px 0 0;

    color:
        rgba(255,255,255,.72);

    font-size:12px;
}


.private-badge{
    position:relative;
    z-index:5;

    align-self:flex-start;

    padding:8px 14px;

    border-radius:30px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.17);

    backdrop-filter:blur(10px);

    font-size:10px;
}


/* ==========================================
   عنوان بخش
========================================== */

.section-title{
    display:flex;
    align-items:center;
    gap:20px;

    margin:
        38px 0 18px;
}


.section-title span{
    color:#d7a62a;

    font-size:11px;
    font-weight:700;
}


.section-title h2{
    margin:2px 0 0;

    color:#063b5c;

    font-size:23px;
}


.section-line{
    flex:1;

    height:1px;

    background:
        linear-gradient(
            to left,
            transparent,
            rgba(8,121,170,.20),
            rgba(215,166,42,.35)
        );
}


/* ==========================================
   کارت آمار
========================================== */

.metrics-card{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    padding:18px;

    border-radius:26px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid
        rgba(8,121,170,.08);

    box-shadow:
        0 15px 40px
        rgba(6,59,92,.07);

    backdrop-filter:blur(14px);
}


.metric{
    display:flex;
    align-items:center;

    gap:13px;

    padding:18px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f1f7fa
        );

    border:
        1px solid
        rgba(6,59,92,.06);

    transition:.35s;
}


.metric:hover{
    transform:translateY(-5px);

    border-color:
        rgba(215,166,42,.35);

    box-shadow:
        0 12px 28px
        rgba(6,59,92,.09);
}


.metric-icon{
    width:45px;
    height:45px;

    flex:0 0 45px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:
        rgba(8,121,170,.08);

    font-size:20px;
}


.metric-info small{
    display:block;

    color:#7c8c95;

    font-size:10px;

    margin-bottom:4px;
}


.metric-info strong{
    display:block;

    color:#063b5c;

    font-size:21px;
}


/* ==========================================
   کارت‌های داشبورد
========================================== */

.dashboard-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;

    margin-top:22px;
}


.dashboard-card{
    position:relative;

    overflow:hidden;

    padding:24px;

    border-radius:25px;

    background:
        rgba(255,255,255,.88);

    border:
        1px solid
        rgba(6,59,92,.07);

    box-shadow:
        0 14px 35px
        rgba(6,59,92,.07);

    backdrop-filter:blur(12px);

    transition:.4s;
}


.dashboard-card::before{
    content:"";

    position:absolute;

    width:100px;
    height:100px;

    left:-60px;
    bottom:-60px;

    border-radius:50%;

    background:
        rgba(215,166,42,.08);

    transition:.5s;
}


.dashboard-card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 22px 45px
        rgba(6,59,92,.12);

    border-color:
        rgba(215,166,42,.25);
}


.dashboard-card:hover::before{
    transform:scale(2);
}


/* ==========================================
   عنوان کارت
========================================== */

.card-heading{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:13px;

    margin-bottom:18px;
}


.card-icon{
    width:46px;
    height:46px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #eef7fb,
            #f8fbfc
        );

    border:
        1px solid
        rgba(8,121,170,.10);

    font-size:21px;
}


.card-heading h3{
    margin:0;

    color:#063b5c;

    font-size:16px;
}


.card-heading span{
    display:block;

    margin-top:3px;

    color:#8a989f;

    font-size:9px;
}


/* ==========================================
   لیست‌ها
========================================== */

.dashboard-card ul{
    position:relative;
    z-index:2;

    list-style:none;

    padding:0;
    margin:0;
}


.dashboard-card li{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    padding:12px 4px;

    border-bottom:
        1px dashed
        #dce6eb;

    color:#24485c;

    font-size:12px;

    transition:.25s;
}


.dashboard-card li:last-child{
    border-bottom:0;
}


.dashboard-card li:hover{
    padding-right:9px;
}


.dashboard-card li span{
    color:#73848c;

    font-size:10px;
}


.dashboard-card li .score{
    color:#0879aa;

    font-weight:800;

    font-size:13px;
}


.loading-item,
.empty-row{
    justify-content:center !important;

    color:#89979e !important;

    border-bottom:0 !important;

    padding:22px 5px !important;
}


/* ==========================================
   وضعیت رضایت‌نامه
========================================== */

.status{
    padding:5px 10px;

    border-radius:20px;

    font-size:9px !important;

    font-weight:700;
}


.status-done{
    color:#267047 !important;

    background:#e9f7ed;
}


.status-pending{
    color:#84630d !important;

    background:#fff5d8;
}


/* ==========================================
   فایل‌ها
========================================== */

.student-file{
    display:flex;

    align-items:center;

    gap:10px;

    padding:13px 15px;

    margin-top:8px;

    border-radius:15px;

    background:#f5f9fb;

    border:
        1px solid
        #e1eaee;

    color:#063b5c;

    text-decoration:none;

    font-size:11px;

    transition:.3s;
}


.student-file:hover{
    transform:translateX(-5px);

    border-color:
        rgba(215,166,42,.35);

    background:#fffaf0;
}


.empty-box{
    padding:18px;

    text-align:center;

    border-radius:15px;

    background:#f6f9fa;

    color:#89979e;

    font-size:10px;
      }
