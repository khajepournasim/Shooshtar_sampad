<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>کادر مدرسه | دبیرستان استعدادهای درخشان شوشتر</title>

    <!-- فونت دست نویس -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           تنظیمات اصلی
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;
            height: auto;

            overflow-x: hidden;
            overflow-y: auto;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(32, 126, 210, 0.08),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(32, 126, 210, 0.07),
                    transparent 30%
                ),

                #ffffff;

            color: #17324d;

            font-family:
                "Vazirmatn",
                Tahoma,
                Arial,
                sans-serif;

            position: relative;
        }


        /* =========================
           خطوط و نقطه های متحرک
        ========================= */

        body::before {

            content: "";

            position: fixed;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(43, 130, 211, 0.13),
                    transparent 68%
                );

            top: 10%;
            right: -100px;

            animation:
                floatingCircle 10s ease-in-out infinite alternate;

            pointer-events: none;

            z-index: 0;
        }


        body::after {

            content: "";

            position: fixed;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(43, 130, 211, 0.10),
                    transparent 70%
                );

            bottom: 8%;
            left: -80px;

            animation:
                floatingCircle2 12s ease-in-out infinite alternate;

            pointer-events: none;

            z-index: 0;
        }


        @keyframes floatingCircle {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-40px, 55px) scale(1.25);
            }

        }


        @keyframes floatingCircle2 {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(55px, -35px) scale(1.2);
            }

        }


        /* نقطه های تزئینی */

        .dot {

            position: fixed;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #4b9ddd;

            opacity: 0.35;

            pointer-events: none;

            z-index: 0;

            animation: dotMove 7s ease-in-out infinite alternate;
        }


        .dot.one {
            top: 18%;
            left: 8%;
        }


        .dot.two {
            top: 42%;
            right: 7%;
            animation-delay: 1.5s;
        }


        .dot.three {
            bottom: 20%;
            left: 13%;
            animation-delay: 3s;
        }


        .dot.four {
            bottom: 12%;
            right: 14%;
            animation-delay: 4s;
        }


        @keyframes dotMove {

            from {
                transform: translateY(0) scale(1);
            }

            to {
                transform: translateY(-25px) scale(1.5);
            }

        }


        /* =========================
           هدر
        ========================= */

        .header {

            position: relative;
            z-index: 2;

            text-align: center;

            padding:
                45px 20px 15px;
        }


        /* لوگوی سمپاد */

        .logo {

            width: 105px;
            height: 105px;

            object-fit: contain;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 8px 16px
                    rgba(20, 70, 110, 0.18)
                );

            animation:
                logoFloat 4s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

        }


        /* عنوان اصلی */

        .header h1 {

            font-family:
                "Aref Ruqaa Ink",
                cursive;

            font-size: clamp(34px, 6vw, 58px);

            font-weight: 700;

            color: #174f7d;

            line-height: 1.4;

            margin-bottom: 5px;

            text-shadow:
                1px 2px 0 rgba(23, 79, 125, 0.08);
        }


        .header p {

            color: #66819a;

            font-size: 15px;

            line-height: 2;

            margin-bottom: 18px;
        }


        /* جمله ویژه */

        .motto {

            display: inline-block;

            position: relative;

            margin: 5px auto 25px;

            padding:
                12px 28px;

            color: #174f7d;

            font-family:
                "Aref Ruqaa Ink",
                cursive;

            font-size:
                clamp(23px, 4vw, 34px);

            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(65, 145, 205, 0.08),
                    transparent
                );

            border-radius: 50px;
        }


        .motto::after {

            content: "";

            position: absolute;

            width: 75%;

            height: 3px;

            bottom: 3px;

            left: 12.5%;

            border-radius: 50%;

            background: #4b9ddd;

            opacity: 0.55;

            transform: rotate(-1deg);
        }


        /* =========================
           دکمه برگشت
        ========================= */

        .back {

            display: inline-block;

            text-decoration: none;

            color: #174f7d;

            border:
                1px solid rgba(23, 79, 125, 0.20);

            background: white;

            padding:
                9px 22px;

            border-radius: 30px;

            font-size: 13px;

            transition:
                0.35s ease;

            box-shadow:
                0 8px 25px
                rgba(23, 79, 125, 0.08);
        }


        .back:hover {

            background: #174f7d;

            color: white;

            transform:
                translateY(-3px);
        }


        /* =========================
           عنوان معرفی
        ========================= */

        .section-title {

            position: relative;

            z-index: 2;

            text-align: center;

            margin:
                25px auto 35px;

            padding:
                0 20px;
        }


        .section-title h2 {

            font-family:
                "Aref Ruqaa Ink",
                cursive;

            font-size:
                clamp(27px, 4vw, 40px);

            font-weight: 700;

            color: #174f7d;

            margin-bottom: 8px;
        }


        .section-title p {

            color: #8298aa;

            font-size: 14px;
        }


        .section-line {

            position: relative;

            width: 120px;

            height: 4px;

            margin:
                14px auto 0;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #4b9ddd,
                    transparent
                );
        }


        .section-line::before {

            content: "";

            position: absolute;

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: #4b9ddd;

            top: -4px;
            right: 20px;

            animation:
                lineDot 3s ease-in-out infinite;
        }


        @keyframes lineDot {

            0% {
                right: 20px;
            }

            50% {
                right: 88px;
            }

            100% {
                right: 20px;
            }

        }


        /* =========================
           شبکه همکاران
        ========================= */

        .staff-container {

            position: relative;

            z-index: 2;

            width: 92%;

            max-width: 1250px;

            margin:
                0 auto 70px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 30px;

            padding:
                5px 0 20px;
        }


        /* =========================
           کارت
        ========================= */

        .staff-card {

            position: relative;

            background: rgba(255,255,255,0.94);

            border:
                1px solid rgba(54, 126, 181, 0.14);

            border-radius: 30px;

            padding:
                30px 24px;

            text-align: center;

            box-shadow:
                0 18px 45px
                rgba(32, 91, 135, 0.10);

            overflow: hidden;

            transition:
                transform 0.45s ease,
                box-shadow 0.45s ease;

            animation:
                cardAppear 0.8s ease both;
        }


        .staff-card:nth-child(2) {
            animation-delay: 0.1s;
        }


        .staff-card:nth-child(3) {
            animation-delay: 0.2s;
        }


        .staff-card:nth-child(4) {
            animation-delay: 0.3s;
        }


        .staff-card:nth-child(5) {
            animation-delay: 0.4s;
        }


        .staff-card:nth-child(6) {
            animation-delay: 0.5s;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    translateY(35px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        .staff-card:hover {

            transform:
                translateY(-10px);

            box-shadow:
                0 25px 55px
                rgba(32, 91, 135, 0.17);
        }


        /* خط تزئینی */

        .staff-card::before {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border:
                1px solid
                rgba(63, 143, 202, 0.12);

            border-radius: 50%;

            top: -90px;
            left: -70px;

            animation:
                rotateDecor 12s linear infinite;
        }


        .staff-card::after {

            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            border:
                1px solid
                rgba(63, 143, 202, 0.10);

            border-radius: 50%;

            bottom: -60px;
            right: -40px;

            animation:
                rotateDecor2 10s linear infinite;
        }


        @keyframes rotateDecor {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes rotateDecor2 {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }

        }


        /* =========================
           عکس همکار
        ========================= */

        .photo-wrap {

            position: relative;

            width: 160px;
            height: 160px;

            margin:
                0 auto 18px;
        }


        .staff-photo {

            width: 160px;
            height: 160px;

            border-radius: 50%;

            object-fit: cover;

            border:
                5px solid white;

            box-shadow:
                0 10px 30px
                rgba(24, 78, 119, 0.20);

            transition:
                transform 0.55s ease;

            position: relative;

            z-index: 2;

            background: #eef6fb;
        }


        .staff-card:hover .staff-photo {

            transform:
                scale(1.06)
                rotate(2deg);
        }


        /* حلقه متحرک دور عکس */

        .photo-ring {

            position: absolute;

            inset: -8px;

            border:
                2px dashed
                #4b9ddd;

            border-radius: 50%;

            opacity: 0.55;

            animation:
                ringRotate 9s linear infinite;

            z-index: 1;
        }


        @keyframes ringRotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           نام
        ========================= */

        .staff-card h3 {

            position: relative;

            z-index: 2;

            font-family:
                "Aref Ruqaa Ink",
                cursive;

            font-size: 27px;

            font-weight: 700;

            color: #174f7d;

            margin-bottom: 4px;

            line-height: 1.5;
        }


        .position {

            position: relative;

            z-index: 2;

            color: #4b9ddd;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 18px;
        }


        /* =========================
           رزومه
        ========================= */

        .resume {

            position: relative;

            z-index: 2;

            text-align: right;

            background:
                linear-gradient(
                    135deg,
                    rgba(238,247,253,0.85),
                    rgba(250,253,255,0.95)
                );

            border:
                1px solid
                rgba(60, 135, 190, 0.10);

            border-radius: 18px;

            padding:
                17px;

            font-size: 13px;

            line-height: 2.25;

            color: #526d82;

            min-height: 120px;
        }


        .resume strong {

            color: #174f7d;

            font-weight: 700;
        }


        /* =========================
           دکمه رزومه
        ========================= */

        .more {

            position: relative;

            z-index: 2;

            display: inline-block;

            margin-top: 18px;

            padding:
                9px 20px;

            border-radius: 30px;

            background: #174f7d;

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                0.35s ease;

            box-shadow:
                0 8px 20px
                rgba(23, 79, 125, 0.18);
        }


        .more:hover {

            background: #4b9ddd;

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(23, 79, 125, 0.22);
        }


        /* =========================
           راهنمای افزودن
        ========================= */

        .add-note {

            position: relative;

            z-index: 2;

            width: 90%;

            max-width: 900px;

            margin:
                10px auto 70px;

            padding:
                22px 25px;

            border-radius: 25px;

            text-align: center;

            background:
                rgba(246,250,253,0.95);

            border:
                1px dashed
                rgba(52, 128, 184, 0.25);

            color: #668096;

            font-size: 13px;

            line-height: 2.3;
        }


        .add-note strong {

            color: #174f7d;
        }


        /* =========================
           فوتر
        ========================= */

        footer {

            position: relative;

            z-index: 2;

            text-align: center;

            padding:
                25px 20px 35px;

            color: #8aa0b1;

            font-size: 12px;
        }


        /* =========================
           موبایل
        ========================= */

        @media (max-width: 650px) {

            .header {
                padding-top: 30px;
            }


            .logo {

                width: 85px;
                height: 85px;
            }


            .header h1 {

                font-size: 35px;
            }


            .motto {

                font-size: 24px;

                padding:
                    10px 15px;
            }


            .staff-container {

                width: 88%;

                grid-template-columns:
                    1fr;

                gap: 22px;
            }


            .staff-card {

                padding:
                    27px 20px;
            }


            .staff-photo,
            .photo-wrap {

                width: 145px;
                height: 145px;
            }


            .staff-card h3 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- نقاط متحرک -->

    <span class="dot one"></span>
    <span class="dot two"></span>
    <span class="dot three"></span>
    <span class="dot four"></span>


    <!-- =========================
         هدر
    ========================= -->

    <header class="header">

        <!-- لوگوی رنگی سمپاد -->
        <img
            src="images/logo.png"
            alt="لوگوی سمپاد"
            class="logo"
        >


        <h1>
            کادر مدرسه
        </h1>


        <p>
            دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر
        </p>


        <div class="motto">
            معلمان، چراغ راه آینده‌اند
        </div>


        <br>


        <a
            href="index.html"
            class="back"
        >
            ← بازگشت به صفحه اصلی
        </a>

    </header>



    <!-- =========================
         عنوان
    ========================= -->

    <section class="section-title">

        <h2>
            آشنایی با کادر آموزشی و اجرایی
        </h2>

        <p>
            همراهان مسیر رشد، یادگیری و موفقیت دانش‌آموزان
        </p>

        <div class="section-line"></div>

    </section>



    <!-- =========================
         کارت همکاران
    ========================= -->

    <main class="staff-container">



        <!-- =========================
             مدیر
        ========================= -->

        <article class="staff-card">

            <div class="photo-wrap">

                <div class="photo-ring"></div>

                <img
                    src="images/staff-modir.jpg"
                    alt="محترم شلیبی"
                    class="staff-photo"
                >

            </div>


            <h3>
                محت
