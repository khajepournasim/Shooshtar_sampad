<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کادر آموزشی و اجرایی مدرسه | سمپاد شوشتر</title>

    <!-- فونت دست‌نویس و خوانا -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
          rel="stylesheet">


<style>

/* =====================================================
   تنظیمات اصلی
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    background:
        radial-gradient(circle at 5% 15%, rgba(41,111,174,.08), transparent 20%),
        radial-gradient(circle at 95% 70%, rgba(230,160,25,.06), transparent 20%),
        #ffffff;

    color: #092d55;

    min-height: 100vh;

    overflow-x: hidden;

    font-family: "Vazirmatn", Tahoma, sans-serif;
}


/* =====================================================
   لکه های آبرنگی اطراف صفحه
===================================================== */

.water-left,
.water-right {

    position: fixed;

    width: 240px;
    height: 340px;

    opacity: .13;

    filter: blur(2px);

    pointer-events: none;

    z-index: -2;
}

.water-left {

    left: -100px;
    top: 180px;

    background:
        radial-gradient(
            ellipse,
            #75a9d5 0%,
            rgba(117,169,213,.3) 45%,
            transparent 70%
        );

    transform: rotate(-20deg);
}

.water-right {

    right: -100px;
    bottom: 60px;

    background:
        radial-gradient(
            ellipse,
            #75a9d5 0%,
            rgba(117,169,213,.3) 45%,
            transparent 70%
        );

    transform: rotate(25deg);
}


/* =====================================================
   نقاط شناور
===================================================== */

.spark {

    position: fixed;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #e4a01a;

    opacity: .7;

    pointer-events: none;

    animation: sparkleMove 5s ease-in-out infinite;

    z-index: -1;
}

.spark.s1 {
    top: 18%;
    left: 7%;
}

.spark.s2 {
    top: 32%;
    right: 8%;
    animation-delay: 1s;
}

.spark.s3 {
    top: 70%;
    left: 10%;
    animation-delay: 2s;
}

.spark.s4 {
    bottom: 15%;
    right: 12%;
    animation-delay: 3s;
}

@keyframes sparkleMove {

    0%,100% {
        transform: translateY(0) scale(1);
        opacity: .45;
    }

    50% {
        transform: translateY(-15px) scale(1.5);
        opacity: 1;
    }
}


/* =====================================================
   طرح های دست کشیده
===================================================== */

.doodle {

    position: absolute;

    pointer-events: none;

    z-index: 0;
}

.leaf-left {

    top: 115px;
    left: 25px;

    width: 130px;
    height: 160px;

    border-left: 2px solid #1a4f80;

    border-radius: 50%;

    transform: rotate(-30deg);

    opacity: .7;
}

.leaf-left::before,
.leaf-left::after {

    content: "";

    position: absolute;

    width: 55px;
    height: 25px;

    border-top: 2px solid #1a4f80;

    border-radius: 50%;
}

.leaf-left::before {

    top: 35px;
    left: -30px;

    transform: rotate(-25deg);
}

.leaf-left::after {

    top: 75px;
    left: -35px;

    transform: rotate(-45deg);
}


/* برگ سمت راست */

.leaf-right {

    right: 25px;
    bottom: 130px;

    width: 120px;
    height: 150px;

    border-right: 2px solid #1a4f80;

    border-radius: 50%;

    transform: rotate(30deg);

    opacity: .7;
}


/* =====================================================
   هدر
===================================================== */

.header {

    position: relative;

    width: 100%;

    text-align: center;

    padding: 35px 20px 15px;

    min-height: 245px;

    overflow: hidden;
}


/* لوگو */

.logo {

    position: absolute;

    top: 18px;
    right: 35px;

    width: 130px;
    height: 130px;

    object-fit: contain;

    filter:
        drop-shadow(0 8px 15px rgba(0,0,0,.10));

    animation: logoFloat 4s ease-in-out infinite;

    z-index: 3;
}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* دکمه بازگشت */

.back {

    position: absolute;

    top: 25px;
    left: 35px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px 22px;

    border: 1px solid #e2a42b;

    border-radius: 30px;

    background: rgba(255,255,255,.9);

    color: #0a315c;

    text-decoration: none;

    font-family: "Vazirmatn", sans-serif;

    font-size: 13px;

    transition: .35s;

    z-index: 5;
}

.back:hover {

    background: #e3a126;

    color: white;

    transform: translateY(-3px);

}


/* عنوان اصلی */

.header h1 {

    position: relative;

    display: inline-block;

    margin-top: 20px;

    font-family: "Noto Nastaliq Urdu", serif;

    font-size: clamp(38px, 5vw, 65px);

    font-weight: 700;

    line-height: 1.5;

    color: #082f61;

    text-shadow: 0 2px 0 rgba(255,255,255,.8);

}


/* خط طلایی زیر عنوان */

.header h1::after {

    content: "";

    position: absolute;

    bottom: -5px;

    left: 5%;

    width: 90%;

    height: 4px;

    background: #dfa02a;

    border-radius: 50%;

    transform: rotate(-1deg);

    animation: lineGrow 2s ease both;
}

@keyframes lineGrow {

    from {
        width: 0;
    }

    to {
        width: 90%;
    }
}


/* متن زیر عنوان */

.header p {

    margin-top: 18px;

    color: #24496b;

    font-size: 15px;

    font-weight: 500;
}


/* تزئین کوچک */

.header p::before {

    content: "✦";

    color: #dfa02a;

    margin-left: 12px;
}

.header p::after {

    content: "✦";

    color: #dfa02a;

    margin-right: 12px;
}


/* =====================================================
   فلش و قلب و هواپیما
===================================================== */

.paper-plane {

    position: absolute;

    left: 20%;

    top: 35px;

    font-size: 38px;

    color: #092f61;

    transform: rotate(-15deg);

    animation: planeMove 5s ease-in-out infinite;
}

@keyframes planeMove {

    0%,100% {
        transform: translate(0,0) rotate(-15deg);
    }

    50% {
        transform: translate(25px,-12px) rotate(-5deg);
    }
}


.heart {

    position: absolute;

    left: 31%;

    top: 45px;

    font-size: 45px;

    color: #dfa02a;

    animation: heartBeat 2.5s infinite;
}

@keyframes heartBeat {

    0%,100% {
        transform: scale(1) rotate(-10deg);
    }

    50% {
        transform: scale(1.12) rotate(-5deg);
    }
}


/* =====================================================
   عنوان معرفی
===================================================== */

.section-title {

    text-align: center;

    margin: 5px auto 30px;

    position: relative;

    z-index: 2;
}

.section-title h2 {

    font-family: "Noto Nastaliq Urdu", serif;

    font-size: 28px;

    color: #123d69;

    font-weight: 700;
}

.section-title span {

    display: block;

    width: 65px;

    height: 3px;

    margin: 8px auto;

    background: #dfa02a;

    border-radius: 50%;
}


/* =====================================================
   شبکه کارت ها
===================================================== */

.staff-container {

    width: 90%;

    max-width: 1250px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 24px;

    position: relative;

    z-index: 2;
}


/* =====================================================
   کارت
===================================================== */

.staff-card {

    position: relative;

    background: rgba(255,255,255,.96);

    border: 1px solid #e5eaf0;

    border-radius: 25px;

    padding: 20px 18px 18px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(9,45,85,.08);

    transition:

        transform .45s ease,
        box-shadow .45s ease;

    overflow: hidden;

    animation: cardIn .8s ease both;
}


/* زمان بندی ورود کارت ها */

.staff-card:nth-child(1) {
    animation-delay: .1s;
}

.staff-card:nth-child(2) {
    animation-delay: .2s;
}

.staff-card:nth-child(3) {
    animation-delay: .3s;
}

.staff-card:nth-child(4) {
    animation-delay: .4s;
}

.staff-card:nth-child(5) {
    animation-delay: .5s;
}

.staff-card:nth-child(6) {
    animation-delay: .6s;
}

.staff-card:nth-child(7) {
    animation-delay: .7s;
}


@keyframes cardIn {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


.staff-card:hover {

    transform: translateY(-10px);

    box-shadow:
        0 20px 45px rgba(9,45,85,.15);
}


/* خط طلایی متحرک بالای کارت */

.staff-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 100%;

    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        #dfa02a,
        transparent
    );

    transition: .7s;
}

.staff-card:hover::before {

    left: 100%;
}


/* =====================================================
   آیکون کارت
===================================================== */

.card-icon {

    position: absolute;

    top: 15px;

    right: 15px;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border: 1px solid #d9e4ef;

    background: #f8fbfd;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #104b7d;

    font-size: 21px;

    transition: .4s;
}

.staff-card:hover .card-icon {

    transform: rotate(8deg) scale(1.08);

    border-color: #dfa02a;

    color: #dfa02a;
}


/* =====================================================
   عکس
===================================================== */

.photo-wrap {

    position: relative;

    display: inline-block;

    margin: 3px auto 12px;
}


/* حلقه دایره ای */

.photo-wrap::before,
.photo-wrap::after {

    content: "";

    position: absolute;

    width: 175px;

    height: 175px;

    border-radius: 50%;

    border: 1.5px solid #2a6799;

    top: -10px;

    left: -10px;

    opacity: .65;

    transition: .5s;
}

.photo-wrap::before {

    transform: rotate(12deg);
}

.photo-wrap::after {

    transform: rotate(-18deg);

    border-color: #dfa02a;

    border-width: 1px;
}


.staff-photo {

    position: relative;

    width: 145px;

    height: 145px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    border: 5px solid white;

    box-shadow:
        0 8px 20px rgba(0,0,0,.12);

    z-index: 2;

    transition: .5s;

    animation: photoFloat 4s ease-in-out infinite;
}

@keyframes photoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}


.staff-card:hover .photo-wrap::before {

    transform:
        rotate(35deg)
        scale(1.04);
}

.staff-card:hover .photo-wrap::after {

    transform:
        rotate(-40deg)
        scale(1.04);
}

.staff-card:hover .staff-photo {

    transform: scale(1.04);
}


/* =====================================================
   نام همکار
===================================================== */

.staff-card h3 {

    font-family: "Noto Nastaliq Urdu", serif;

    font-size: 27px;

    line-height: 1.7;

    font-weight: 700;

    color: #092f61;

    margin-top: 5px;

    margin-bottom: 2px;
}


/* =====================================================
   سمت
===================================================== */

.position {

    display: inline-block;

    padding: 3px 20px;

    border-radius: 20px;

    background: #d99a22;

    color: white;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 12px;

    box-shadow:
        0 5px 12px rgba(217,154,34,.18);
}


/* =====================================================
   رزومه
===================================================== */

.resume {

    text-align: right;

    padding: 5px 8px 4px;

    min-height: 120px;

    color: #263f58;

    font-family: "Vazirmatn", sans-serif;

    font-size: 12px;

    line-height: 2.05;
}


.resume .item {

    position: relative;

    padding-right: 15px;

    margin-bottom: 2px;
}


.resume .item::before {

    content: "";

    position: absolute;

    right: 0;

    top: 12px;

    width: 5px;

    height: 5px;

    background: #dfa02a;

    border-radius: 50%;
}


.resume strong {

    color: #0c3d6a;
}


/* =====================================================
   دکمه رزومه
===================================================== */

.more {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    width: 90%;

    margin: 8px auto 0;

    padding: 9px 15px;

    border-radius: 25px;

    background: #082f61;

    color: white;

    text-decoration: none;

    font-family: "Vazirmatn", sans-serif;

    font-size: 12px;

    font-weight: 600;

    transition: .35s;

    box-shadow:
        0 7px 18px rgba(8,47,97,.18);
}

.more span {

    font-size: 20px;

    line-height: 0;

    transition: .3s;
}

.more:hover {

    background: #dfa02a;

    transform: translateY(-3px);
}

.more:hover span {

    transform: translateX(-5px);
}


/* =====================================================
   کارت خالی اضافه کردن همکار
===================================================== */

.empty-card {

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f7fafc
        );

    border-style: dashed;

    border-color: #cad8e5;

    display: flex;

    flex-direction: column;

    justify-content: center;

    min-height: 450px;
}


.plus {

    width: 85px;

    height: 85px;

    border-radius: 50%;

    margin: 0 auto 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 45px;

    color: #145181;

    background: #eef5fa;

    border: 1px solid #d7e4ee;

    animation: plusFloat 3s ease-in-out infinite;
}

@keyframes plusFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =====================================================
   بخش جمله الهام بخش
===================================================== */

.quote-box {

    min-height: 450px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 20px;

    position: relative;

    overflow: hidden;
}


.quote-box .quote {

    font-family: "Noto Nastaliq Urdu", serif;

    font-size: 34px;

    line-height: 2;

    color: #092f61;

    font-weight: 700;

    position: relative;
}


.quote-box .quote::after {

    content: "";

    display: block;

    width: 180px;

    height: 3px;

    background: #dfa02a;

    margin: 5px auto;

    border-radius: 50%;

    transform: rotate(-2deg);
}


.quote-heart {

    color: #dfa02a;

    font-size: 50px;

    animation: heartBeat 2s infinite;

    margin-top: 10px;
}


.feather {

    font-size: 70px;

    color: #537b9e;

    transform: rotate(-20deg);

    opacity: .7;

    animation: featherFloat 4s infinite ease-in-out;
}

@keyframes featherFloat {

    0%,100% {
        transform: translateY(0) rotate(-20deg);
    }

    50% {
        transform: translateY(-10px) rotate(-12deg);
    }
}


/* =====================================================
   پیام پایین
===================================================== */

.footer-note {

    width: 65%;

    margin: 35px auto 60px;

    padding: 10px 20px;

    text-align: center;

    border: 1px solid #e0e7ee;

    border-radius: 30px;

    color: #173f62;

    font-size: 14px;

    background: rgba(255,255,255,.8);
}


.footer-note .gold {

    color: #dfa02a;

    font-size: 22px;

    margin: 0 10px;
}


/* =====================================================
   موبایل
===================================================== */

@media (max-width: 1100px) {

    .staff-container {

        grid-template-columns:
            repeat(3, 1fr);

    }

}


@media (max-width: 800px) {

    .staff-container {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .logo {

        position: relative;

        top: auto;
        right: auto;

        width: 90px;
        height: 90px;
    }

    .header {

        padding-top: 15px;
    }

    .back {

        position: relative;

        top: auto;
        left: auto;

        display: inline-flex;

        margin-bottom: 15px;
    }

    .header h1 {

        margin-top: 5px;

        font-size: 38px;
    }

}


@media (max-width: 560px) {

    .staff-container {

        grid-template-columns: 1fr;

        width: 88%;
    }

    .header h1 {

        font-size: 32px;
    }

    .header p {

        font-size: 12px;

        line-height: 2;
    }

    .footer-note {

        width: 88%;
    }

    .quote-box {

        min-height: 330px;
    }

    .quote-box .quote {

        font-size: 28px;
    }

    .paper-plane,
    .heart {

        display: none;
    }

}

</style>

</head>


<body>


<!-- لکه های پس زمینه -->

<div class="water-left"></div>
<div class="water-right"></div>


<!-- نقاط متحرک -->

<div class="spark s1"></div>
<div class="spark s2"></div>
<div class="spark s3"></div>
<div class="spark s4"></div>


<!-- تزئینات -->

<div class="doodle leaf-left"></div>
<div class="doodle leaf-right"></div>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <!-- لوگوی رنگی سمپاد -->

    <img
        src="images/logo.png"
        alt="لوگوی سمپاد"
        class="logo"
    >


    <!-- دکمه برگشت -->

    <a
        href="index.html"
        class="back"
    >
        ←
        بازگشت به صفحه اصلی
    </a>


    <!-- هواپیمای کاغذی -->

    <div class="paper-plane">
        ➤
    </div>


    <!-- قلب -->

    <div class="heart">
        ♡
    </div>


    <!-- عنوان -->

    <h1>
        کادر آموزشی و اجرایی مدرسه
    </h1>


    <p>
        دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر
    </p>


</header>



<!-- =====================================================
     عنوان معرفی
===================================================== -->

<section class="section-title">

    <h2>
        آشنایی با همکاران مدرسه
    </h2>

    <span></span>

</section>



<!-- =====================================================
     کارت ها
===================================================== -->

<main class="staff-container">



<!-- =====================================================
     محترم شلیبی
===================================================== -->

<div class="staff-card">

    <div class="card-icon">
        ♙
    </div>


    <div class="photo-wrap">

        <img
            src="images/staff-modir.jpg"
            alt="محترم شلیبی"
            class="staff-photo"
        >

    </div>


    <h3>
        محترم شلیبی
    </h3>


    <div class="position">
        مدیر مدرسه
    </div>


    <div class="resume">

        <div class="item">
            مدیر دبیرستان استعدادهای درخشان شوشتر
        </div>

        <div class="item">
            بیش از ۳۰ سال سابقه مدیریتی و آموزشی
        </div>

        <div class="item">
            پیشرو در توسعه کیفیت آموزشی
        </div>

    </div>


    <a href="#" class="more">
        <span>←</span>
        مشاهده رزومه کامل
    </a>

</div>



<!-- =====================================================
     اکرم حکمت زاده
===================================================== -->

<div class="staff-card">

    <div class="card-icon">
        ♧
    </div>


    <div class="photo-wrap">

        <img
            src="
