<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>افتخارات | سمپاد شوشتر</title><style>body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9fc;color:#183b50}.wrap{width:min(1120px,92%);margin:auto}.hero{padding:60px 18px;text-align:center;background:linear-gradient(135deg,#063b5c,#075f82);color:white}.hero h1{font-size:clamp(32px,6vw,54px)}.hero span{color:#f5df91}.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:30px 0}.filter{border:1px solid #dce7ee;background:white;color:#063b5c;border-radius:14px;padding:9px 14px;font-weight:bold;cursor:pointer}.filter.active{background:#f3d875;color:#684d08}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding-bottom:70px}.card{position:relative;background:#fff;border:1px solid #dce7ee;border-radius:24px;padding:20px;overflow:hidden;box-shadow:0 12px 30px #063b5c12;transition:.35s}.card:before{content:"";position:absolute;width:170px;height:170px;right:-90px;top:-90px;border-radius:50%;background:radial-gradient(circle,#d7a62a20,transparent 68%);transition:.4s}.card:hover{transform:translateY(-8px);box-shadow:0 22px 45px #063b5c20;border-color:#d7a62a88}.card:hover:before{width:280px;height:280px}.head{display:flex;justify-content:space-between;gap:8px}.tag{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:bold;background:#eef6fa;color:#063b5c}.level{background:#fff5cf;color:#7c5b0b}.card h2{color:#063b5c;font-size:17px;line-height:1.8}.person{display:flex;gap:12px;align-items:center;background:#f8fbfc;border-right:4px solid #d7a62a66;padding:12px;border-radius:16px;margin:10px 0}.avatar{width:46px;height:46px;min-width:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff7dc,#f1d978);border:1px solid #d7a62a;color:#063b5c;font-size:22px}.person b{display:block;font-size:14px;color:#063b5c}.person span{display:block;font-size:10px;color:#71818a;line-height:1.7}.rank-badge{display:inline-block;margin-top:5px;padding:5px 10px;border-radius:999px;background:#fff0bd;border:1px solid #d7a62a;color:#694e08;font-size:18px;font-weight:900;line-height:1.6;box-shadow:0 6px 16px #d7a62a22}.student-label{display:flex;flex-direction:column;gap:2px}.note{margin-top:9px;padding:7px 10px;border-radius:12px;background:#fff9e6;color:#76580b;font-size:10px}.empty{text-align:center;background:white;border:1px dashed #d7a62a;padding:35px;border-radius:20px;grid-column:1/-1}footer{background:#062f4b;color:white;text-align:center;padding:28px}footer a{color:#f5df91;margin:0 8px;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><section class="hero"><div class="wrap"><a href="index.html" style="color:white">← صفحه اصلی</a><h1>افتخارات <span>دانش‌آموزان</span></h1><p>درخشش، تلاش و موفقیت دانش‌آموزان دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر</p></div></section><main class="wrap"><div class="filters" id="filters"><button class="filter active" data-cat="all">همه افتخارات</button><button class="filter" data-cat="quran">قرآن و عترت</button><button class="filter" data-cat="scientific">علمی و پژوهشی</button><button class="filter" data-cat="cultural">فرهنگی و هنری</button><button class="filter" data-cat="university">پذیرفته‌شدگان دانشگاه‌ها</button></div><div id="grid" class="grid"></div></main><footer>دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر<br><a href="index.html">خانه</a><a href="staff.html">کادر و همکاران</a></footer><script>const ITEMS=[
{title:'درخشش مریم فراشی در بخش حفظ ویژه کنگره سراسری قرآن کریم',level:'قطب دو کشور',category:'quran',students:[['مریم فراشی','حفظ ویژه سی‌امین کنگره سراسری قرآن کریم مدارس استعدادهای درخشان قطب دو کشور']]},
{title:'افتخارآفرینان مرحله قطبی رشته مفاهیم',level:'مرحله قطبی',category:'quran',students:[['شهرزاد محمدپور','رشته مفاهیم'],['نسترن صفدری','رشته مفاهیم']]},
{title:'برگزیدگان مسابقات مذهبی فرزانگان۲',level:'شهرستان',category:'quran',students:[['سونیا چهارلنگی','رشته صحیفه سجادیه — رتبه اول (دعوت به کارگاه)'],['یاسمین جهانگیر','رشته گفت‌وگوی مهدوی — رتبه اول (دعوت به کارگاه)'],['شمس‌الهدی طیبی','رشته دعاخوانی — رتبه دوم'],['مهدیس وحید','رشته دعاخوانی — رتبه دوم'],['سهی بازوند','رشته نهج‌البلاغه — رتبه اول (دعوت به کارگاه)'],['ثنا لاله‌زاری','رشته نهج‌البلاغه — رتبه سوم'],['بهار باغبان','رشته احکام — رتبه اول (دعوت به کارگاه)'],['مبینا شلیبی','رشته احکام — رتبه سوم'],['رباب عبدالهی','رشته احکام — رتبه دوم مشترک'],['راضیه راثی','رشته تفسیر — رتبه اول'],['دینا کفه‌زاده','رشته انشای نماز — رتبه دوم']]},
{title:'افتخارآفرینی آزاده مرداسی در مسابقه حافظ‌خوانی',level:'شهرستان',category:'quran',students:[['آزاده مرداسی','مسابقه حافظ‌خوانی — رتبه سوم']]},
{title:'راهیابی تیم فرزانگان شوشتر به مرحله ملی تفکر سیستمی و حکمرانی داده‌محور',level:'مرحله ملی',category:'scientific',leader:'سیده زینب مرعشی',mentor:'نسیم خواجه‌پور',students:[['رقیه زیلایی','عضو تیم'],['اسما علیمحمدی','عضو تیم'],['سیده زهرا الهی‌دوست','عضو تیم']]},
{title:'راهیابی تیم دبیرستان استعدادهای درخشان شوشتر به مرحله بعد آزمون نوپایا',level:'مرحله بعد',category:'scientific',leader:'یاسمن جهانگیر',students:[['زینب بلغار','عضو تیم'],['مهرگان کاظمی','عضو تیم'],['مبینا رضایی مجد','عضو تیم'],['نرگس تقی‌پور','عضو تیم']]},
{title:'راهیابی به مرحله دوم کارسوق حکمرانی داده‌محور',level:'مرحله دوم',category:'scientific',students:[['فاطمه للری','راهیابی در کارسوق حکمرانی داده‌محور']]},
{title:'رتبه‌های شهرستانی مسابقات فرهنگی و هنری امید فردا',level:'رتبه شهرستان',category:'cultural',students:[['مهرگان کاظمی','رشته کاریکاتور — رتبه اول شهرستان'],['مبینا کاهش‌زاده','رشته رنگ و روغن — رتبه اول شهرستان'],['پرند گودرزی','رشته میناکاری — رتبه اول شهرستان'],['سوگند بهرامی','رشته میناکاری — رتبه اول شهرستان'],['دانش‌آموزان منتخب','رشته نقاشی همگانی — رتبه اول شهرستان']]},
{title:'رتبه‌های ارزشمند در مسابقات فرهنگی و هنری',level:'شهرستان',category:'cultural',students:[['آزاده مرداسی','مسابقه حافظ‌خوانی — رتبه سوم شهرستان']]},
{title:'قبولی ۵ نفر از ۶ دانش‌آموز رشته ریاضی در دانشگاه فرهنگیان',level:'دانشگاه فرهنگیان',category:'university',students:[['رضوان صفرزاده','دبیری معماری داخلی — شهید رجایی تهران'],['سارینا حسنکی','دبیری کامپیوتر — شهید رجایی تهران'],['حدیث نورالله','دبیری فیزیک — اصفهان'],['مبینا ترابی','دبیری ریاضی — اهواز'],['شکوفه فتح‌الله‌نژاد','دبیری ریاضی — اهواز']]}
];const names={quran:'قرآن و عترت',scientific:'علمی و پژوهشی',cultural:'فرهنگی و هنری',university:'پذیرفته‌شدگان دانشگاه‌ها'};function rankText(text){const m=text.match(/(رتبه\s+(?:اول|دوم|سوم|چهارم|پنجم|\d+)|مرحله\s+(?:اول|دوم|سوم|ملی|قطبی|بعد)|قبولی[^—]*|راهیابی[^—]*)/);return m?m[1]:''}function render(cat='all'){let list=ITEMS.filter(x=>cat==='all'||x.category===cat);grid.innerHTML=list.length?list.map(x=>`<article class="card"><div class="head"><span class="tag">${names[x.category]}</span><span class="tag level">${x.level}</span></div><h2>${x.title}</h2>${x.students.map(s=>{const r=rankText(s[1]); return `<div class="person"><div class="avatar" aria-hidden="true">👩🏻‍🎓</div><div class="student-label"><b>${s[0]}</b><span>${s[1]}</span>${r?`<strong class="rank-badge">${r}</strong>`:''}</div></div>`}).join('')}${x.mentor?`<div class="note">استاد راهنما: ${x.mentor}</div>`:''}${x.leader?`<div class="note">سرگروه: ${x.leader}</div>`:''}</article>`).join(''):'<div class="empty">در این بخش هنوز افتخاری ثبت نشده است.</div>'}render();document.getElementById('filters').onclick=e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.cat)};</script></body></html>
