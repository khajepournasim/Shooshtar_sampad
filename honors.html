<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>افتخارات دانش‌آموزان | سمپاد شوشتر</title><link rel="stylesheet" href="assets/site.css"><style>
body.honors-page{min-height:100vh;background:linear-gradient(#063b5cbf,#063b5cbb),url("images/school-gate.jpg") center/cover fixed no-repeat;color:#183b50}
.honors-shell{min-height:100vh;background:#ffffffea;padding-bottom:55px}.honors-hero{padding:55px 18px 42px;text-align:center;color:#fff;background:linear-gradient(135deg,#063b5ce8,#075f82d9),url("images/school-gate.jpg") center/cover no-repeat}.honors-hero h1{font-family:Mirza,Tahoma,sans-serif;font-size:clamp(36px,6vw,58px);margin:8px 0}.honors-hero h1 span{color:#f7e6a1}.honors-hero p{max-width:760px;margin:auto;font-size:13px;line-height:2}.back-home{display:inline-block;margin-top:12px;padding:9px 17px;border:1px solid #ffffff66;border-radius:15px;color:#fff;background:#ffffff12}.honors-wrap{width:min(1120px,92%);margin:auto}.honors-filters{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:28px 0 20px}.honors-filter{border:1px solid #dce7ee;background:white;color:#063b5c;border-radius:14px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}.honors-filter.active{background:#f3d875;color:#684d08}.honors-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.honor-card{position:relative;background:#fff;border:1px solid #dce7ee;border-radius:25px;padding:22px;overflow:hidden;box-shadow:0 12px 30px #063b5c12;transition:.35s}.honor-card:hover{transform:translateY(-7px);box-shadow:0 22px 45px #063b5c20;border-color:#d7a62a88}.honor-card:before{content:"";position:absolute;width:190px;height:190px;right:-95px;top:-95px;border-radius:50%;background:radial-gradient(circle,#d7a62a22,transparent 68%)}.honor-head{display:flex;justify-content:space-between;gap:8px;position:relative}.honor-tag{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:800;background:#eef6fa;color:#063b5c}.honor-level{background:#fff5cf;color:#7c5b0b}.honor-card h2{color:#063b5c;font-size:18px;line-height:1.8;position:relative}.honor-person{display:flex;gap:12px;align-items:center;background:#f8fbfc;border-right:4px solid #d7a62a66;padding:12px;border-radius:17px;margin:10px 0;position:relative}.honor-avatar{width:62px;height:62px;min-width:62px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#eef7fa,#fff8df);border:2px solid #d7a62a;box-shadow:0 0 0 5px #d7a62a12}.honor-avatar img{width:100%;height:100%;object-fit:cover}.honor-avatar span{display:none;color:#7d681f;font-size:9px;font-weight:800;text-align:center;padding:5px}.honor-avatar.empty span{display:block}.honor-person b{display:block;font-size:14px;color:#063b5c}.honor-person small{display:block;font-size:10px;color:#71818a;line-height:1.8}.honor-rank{display:inline-block;margin-top:5px;padding:4px 9px;border-radius:999px;background:#fff0bd;border:1px solid #d7a62a;color:#694e08;font-size:12px;font-weight:900}.honor-note{margin-top:9px;padding:8px 10px;border-radius:12px;background:#fff9e6;color:#76580b;font-size:10px}.honor-empty{text-align:center;padding:35px;border:1px dashed #d7a62a;border-radius:20px;grid-column:1/-1}.honors-footer{text-align:center;margin-top:35px}.honors-footer a{color:#8a650b;font-weight:800;margin:0 8px}.honors-gallery-title{text-align:center;margin:5px 0 24px;color:#063b5c;font-family:Mirza,Tahoma,sans-serif;font-size:30px}@media(max-width:760px){.honors-grid{grid-template-columns:1fr}}
</style></head><body class="honors-page"><div class="honors-shell"><section class="honors-hero"><div class="honors-wrap"><a class="back-home" href="index.html">← بازگشت به ورودی مدرسه</a><h1>افتخارات <span>دانش‌آموزان</span></h1><p>درخشش، تلاش و موفقیت دانش‌آموزان دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر</p></div></section><main class="honors-wrap"><h2 class="honors-gallery-title">گالری افتخارهای سمپاد شوشتر</h2><div class="honors-filters" id="filters"><button class="honors-filter active" data-cat="all">همه افتخارات</button><button class="honors-filter" data-cat="quran">قرآن و عترت</button><button class="honors-filter" data-cat="scientific">علمی و پژوهشی</button><button class="honors-filter" data-cat="cultural">فرهنگی و هنری</button><button class="honors-filter" data-cat="university">پذیرفته‌شدگان دانشگاه‌ها</button></div><div id="grid" class="honors-grid"></div><div class="honors-footer"><a href="index.html">صفحه اصلی</a><a href="staff.html">کادر و همکاران</a></div></main></div><script>
const ITEMS=[
{title:'درخشش مریم فراشی در بخش حفظ ویژه کنگره سراسری قرآن کریم',level:'قطب دو کشور',category:'quran',students:[['مریم فراشی','حفظ ویژه سی‌امین کنگره سراسری قرآن کریم مدارس استعدادهای درخشان قطب دو کشور','images/honor-maryam-farashi.jpg']]},
{title:'افتخارآفرینان مرحله قطبی رشته مفاهیم',level:'مرحله قطبی',category:'quran',students:[['شهرزاد محمدپور','رشته مفاهیم','images/honor-shahrzad-mohammadpour.jpg'],['نسترن صفدری','رشته مفاهیم','images/honor-nastaran-safdari.jpg']]},
{title:'برگزیدگان مسابقات مذهبی فرزانگان۲',level:'شهرستان',category:'quran',students:[['سونیا چهارلنگی','رشته صحیفه سجادیه — رتبه اول (دعوت به کارگاه)'],['یاسمین جهانگیر','رشته گفت‌وگوی مهدوی — رتبه اول (دعوت به کارگاه)'],['شمس‌الهدی طیبی','رشته دعاخوانی — رتبه دوم'],['مهدیس وحید','رشته دعاخوانی — رتبه دوم'],['سهی بازوند','رشته نهج‌البلاغه — رتبه اول (دعوت به کارگاه)'],['ثنا لاله‌زاری','رشته نهج‌البلاغه — رتبه سوم'],['بهار باغبان','رشته احکام — رتبه اول (دعوت به کارگاه)'],['مبینا شلیبی','رشته احکام — رتبه سوم'],['رباب عبدالهی','رشته احکام — رتبه دوم مشترک'],['راضیه راثی','رشته تفسیر — رتبه اول'],['دینا کفه‌زاده','رشته انشای نماز — رتبه دوم']]},
{title:'افتخارآفرینی آزاده مرداسی در مسابقه حافظ‌خوانی',level:'شهرستان',category:'quran',students:[['آزاده مرداسی','مسابقه حافظ‌خوانی — رتبه سوم']]},
{title:'راهیابی تیم فرزانگان شوشتر به مرحله ملی تفکر سیستمی و حکمرانی داده‌محور',level:'مرحله ملی',category:'scientific',leader:'سیده زینب مرعشی',mentor:'نسیم خواجه‌پور',students:[['رقیه زیلایی','عضو تیم'],['اسما علیمحمدی','عضو تیم'],['سیده زهرا الهی‌دوست','عضو تیم']]},
{title:'راهیابی تیم دبیرستان استعدادهای درخشان شوشتر به مرحله بعد آزمون نوپایا',level:'مرحله بعد',category:'scientific',leader:'یاسمن جهانگیر',students:[['زینب بلغار','عضو تیم'],['مهرگان کاظمی','عضو تیم'],['مبینا رضایی مجد','عضو تیم'],['نرگس تقی‌پور','عضو تیم']]},
{title:'راهیابی به مرحله دوم کارسوق حکمرانی داده‌محور',level:'مرحله دوم',category:'scientific',students:[['فاطمه للری','راهیابی در کارسوق حکمرانی داده‌محور','images/honor-fatemeh-lalari.jpg']]},
{title:'رتبه‌های شهرستانی مسابقات فرهنگی و هنری امید فردا',level:'رتبه شهرستان',category:'cultural',students:[['مهرگان کاظمی','رشته کاریکاتور — رتبه اول شهرستان'],['مبینا کاهش‌زاده','رشته رنگ و روغن — رتبه اول شهرستان'],['پرند گودرزی','رشته میناکاری — رتبه اول شهرستان'],['سوگند بهرامی','رشته میناکاری — رتبه اول شهرستان'],['دانش‌آموزان منتخب','رشته نقاشی همگانی — رتبه اول شهرستان']]},
{title:'رتبه‌های ارزشمند در مسابقات فرهنگی و هنری',level:'شهرستان',category:'cultural',students:[['آزاده مرداسی','مسابقه حافظ‌خوانی — رتبه سوم شهرستان']]},
{title:'قبولی ۵ نفر از ۶ دانش‌آموز رشته ریاضی در دانشگاه فرهنگیان',level:'دانشگاه فرهنگیان',category:'university',students:[['رضوان صفرزاده','دبیری معماری داخلی — شهید رجایی تهران'],['سارینا حسنکی','دبیری کامپیوتر — شهید رجایی تهران'],['حدیث نورالله','دبیری فیزیک — اصفهان'],['مبینا ترابی','دبیری ریاضی — اهواز'],['شکوفه فتح‌الله‌نژاد','دبیری ریاضی — اهواز']]}
];
const names={quran:'قرآن و عترت',scientific:'علمی و پژوهشی',cultural:'فرهنگی و هنری',university:'پذیرفته‌شدگان دانشگاه‌ها'};
function rankText(text){const m=text.match(/(رتبه\s+(?:اول|دوم|سوم|چهارم|پنجم|\d+)|مرحله\s+(?:اول|دوم|سوم|ملی|قطبی|بعد)|قبولی[^—]*|راهیابی[^—]*)/);return m?m[1]:''}
function render(cat='all'){let list=ITEMS.filter(x=>cat==='all'||x.category===cat);grid.innerHTML=list.length?list.map(x=>`<article class="honor-card"><div class="honor-head"><span class="honor-tag">${names[x.category]}</span><span class="honor-tag honor-level">${x.level}</span></div><h2>${x.title}</h2>${x.students.map((st,i)=>{const r=rankText(st[1]);const img=st[2]||'';return `<div class="honor-person"><div class="honor-avatar ${img?'':'empty'}">${img?`<img src="${img}" alt="${st[0]}" onerror="this.style.display='none';this.parentElement.classList.add('empty')">`:''}<span>عکس دانش‌آموز</span></div><div><b>${st[0]}</b><small>${st[1]}</small>${r?`<strong class="honor-rank">${r}</strong>`:''}</div></div>`}).join('')}${x.mentor?`<div class="honor-note">استاد راهنما: ${x.mentor}</div>`:''}${x.leader?`<div class="honor-note">سرگروه: ${x.leader}</div>`:''}</article>`).join(''):'<div class="honor-empty">در این بخش هنوز افتخاری ثبت نشده است.</div>'}
render();document.getElementById('filters').onclick=e=>{if(!e.target.matches('.honors-filter'))return;document.querySelectorAll('.honors-filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.cat)};
</script></body></html>
