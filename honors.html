<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>افتخارات | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"></head><body><section class="page-hero"><div class="wrap"><a href="index.html">← صفحه اصلی</a><h1>افتخارات دانش‌آموزان</h1><p>نام، رشته و رتبه هر افتخار به‌صورت کامل و خوانا نمایش داده می‌شود.</p></div></section><main class="wrap section" id="honors"><div class="filters" id="filters"><button class="filter active" data-cat="all">همه</button><button class="filter" data-cat="quran">قرآن و عترت</button><button class="filter" data-cat="scientific">علمی و پژوهشی</button><button class="filter" data-cat="cultural">فرهنگی و هنری</button><button class="filter" data-cat="university">دانشگاه فرهنگیان</button></div><div id="honorGrid" class="honor-grid"></div></main><footer><div class="wrap footer-grid"><div><span class="footer-logo"><img src="Assets/sampad-logo.png"></span><h3>دبیرستان استعدادهای درخشان شوشتر</h3></div><div><h4>دسترسی</h4><a href="index.html">خانه</a><a href="staff.html">کادر و همکاران</a></div></div><div class="copyright">© دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر</div></footer><script>const ITEMS=[{"title": "درخشش مریم فراشی در بخش حفظ ویژه کنگره سراسری قرآن کریم", "level": "قطب دو کشور", "students": [["مریم فراشی", "حفظ ویژه سی‌امین کنگره سراسری قرآن کریم مدارس استعدادهای درخشان قطب دو کشور"]], "category": "quran"}, {"title": "افتخارآفرینان مرحله قطبی رشته مفاهیم", "level": "مرحله قطبی", "students": [["شهرزاد محمدپور", "رشته مفاهیم"], ["نسترن صفدری", "رشته مفاهیم"]], "category": "quran"}, {"title": "برگزیدگان مسابقات مذهبی فرزانگان۲", "level": "شهرستان", "students": [["سونیا چهارلنگی", "رشته صحیفه سجادیه — رتبه اول (دعوت به کارگاه)"], ["یاسمین جهانگیر", "رشته گفت‌وگوی مهدوی — رتبه اول (دعوت به کارگاه)"], ["شمس‌الهدی طیبی", "رشته دعاخوانی — رتبه دوم"], ["مهدیس وحید", "رشته دعاخوانی — رتبه دوم"], ["سهی بازوند", "رشته نهج‌البلاغه — رتبه اول (دعوت به کارگاه)"], ["ثنا لاله‌زاری", "رشته نهج‌البلاغه — رتبه سوم"], ["بهار باغبان", "رشته احکام — رتبه اول (دعوت به کارگاه)"], ["مبینا شلیبی", "رشته احکام — رتبه سوم"], ["رباب عبدالهی", "رشته احکام — رتبه دوم مشترک"], ["راضیه راثی", "رشته تفسیر — رتبه اول"], ["دینا کفه‌زاده", "رشته انشای نماز — رتبه دوم"]], "category": "quran"}, {"title": "افتخارآفرینی آزاده مرداسی در مسابقه حافظ‌خوانی", "level": "شهرستان", "students": [["آزاده مرداسی", "مسابقه حافظ‌خوانی — رتبه سوم"]], "category": "quran"}, {"title": "راهیابی تیم فرزانگان شوشتر به مرحله ملی تفکر سیستمی و حکمرانی داده‌محور", "level": "مرحله ملی", "leader": "سیده زینب مرعشی", "mentor": "نسیم خواجه‌پور", "students": [["رقیه زیلایی", "عضو تیم"], ["اسما علیمحمدی", "عضو تیم"], ["سیده زهرا الهی‌دوست", "عضو تیم"]], "category": "scientific"}, {"title": "راهیابی تیم دبیرستان استعدادهای درخشان شوشتر به مرحله بعد آزمون نوپایا", "level": "مرحله بعد", "leader": "یاسمن جهانگیر", "students": [["زینب بلغار", "عضو تیم"], ["مهرگان کاظمی", "عضو تیم"], ["مبینا رضایی مجد", "عضو تیم"], ["نرگس تقی‌پور", "عضو تیم"]], "category": "scientific"}, {"title": "راهیابی به مرحله دوم کارسوق حکمرانی داده‌محور", "level": "مرحله دوم", "students": [["فاطمه للری", "راهیابی در کارسوق حکمرانی داده‌محور"]], "category": "scientific"}, {"title": "رتبه‌های شهرستانی مسابقات فرهنگی و هنری امید فردا", "level": "رتبه شهرستان", "students": [["مهرگان کاظمی", "رشته کاریکاتور — رتبه اول شهرستان"], ["مبینا کاهش‌زاده", "رشته رنگ و روغن — رتبه اول شهرستان"], ["پرند گودرزی", "رشته میناکاری — رتبه اول شهرستان"], ["سوگند بهرامی", "رشته میناکاری — رتبه اول شهرستان"], ["دانش‌آموزان منتخب", "رشته نقاشی همگانی — رتبه اول شهرستان"]], "category": "cultural"}, {"title": "رتبه‌های ارزشمند در مسابقات فرهنگی و هنری", "level": "شهرستان", "students": [["آزاده مرداسی", "مسابقه حافظ‌خوانی — رتبه سوم شهرستان"]], "category": "cultural"}, {"title": "قبولی ۵ نفر از ۶ دانش‌آموز رشته ریاضی در دانشگاه فرهنگیان", "level": "دانشگاه فرهنگیان", "students": [["رضوان صفرزاده", "دبیری معماری داخلی — شهید رجایی تهران"], ["سارینا حسنکی", "دبیری کامپیوتر — شهید رجایی تهران"], ["حدیث نورالله", "دبیری فیزیک — اصفهان"], ["مبینا ترابی", "دبیری ریاضی — اهواز"], ["شکوفه فتح‌الله‌نژاد", "دبیری ریاضی — اهواز"]], "category": "university"}];const grid=document.getElementById('honorGrid');function render(cat='all'){const list=ITEMS.filter(x=>cat==='all'||x.category===cat);grid.innerHTML=list.map(x=>`<article class="honor-card"><div class="honor-head"><span class="honor-type">${x.category==='quran'?'قرآن و عترت':x.category==='scientific'?'علمی و پژوهشی':x.category==='cultural'?'فرهنگی و هنری':'دانشگاه فرهنگیان'}</span><span class="honor-level">${x.level}</span></div><h2>${x.title}</h2><div class="honor-people">${x.students.map(s=>`<div class="honor-person"><div class="honor-avatar">${s[0].trim().slice(0,1)}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}</div>${x.mentor?`<div class="honor-note">استاد راهنما: ${x.mentor}</div>`:''}${x.leader?`<div class="honor-note">سرگروه: ${x.leader}</div>`:''}</article>`).join('')}render();document.getElementById('filters').onclick=e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.cat)};</script></body></html>
