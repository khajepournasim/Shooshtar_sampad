<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>افتخارات دانش‌آموزان | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"><style>.honor-hero{padding:55px 0;text-align:center;background:linear-gradient(135deg,#073b6b,#0b5ea8);color:#fff}.honor-hero h1{font-family:"B Koodak",Estedad,sans-serif;font-size:44px;margin:8px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.filter{border:1px solid var(--line);background:#fff;color:var(--blue);padding:8px 13px;border-radius:999px;font-size:9px;cursor:pointer}.filter.active{background:var(--blue);color:#fff}.honor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.honor-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 35px rgba(15,74,119,.06);transition:.25s}.honor-card:hover{transform:translateY(-5px)}.honor-type{font-size:8px;color:var(--blue);font-weight:800}.honor-card h3{font-size:13px;margin:6px 0}.honor-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{font-size:7px;padding:4px 8px;border-radius:999px;background:#eef7ff;color:#376a8f}.honor-card ul{margin:8px 0;padding-right:18px;color:var(--muted);font-size:9px}.mentor{font-size:8px;color:#8a681e;background:#fff7df;padding:8px;border-radius:10px}</style></head><body><section class="honor-hero"><div class="wrap"><a href="index.html" style="color:#ffe09a;text-decoration:none;font-size:9px">← صفحه اصلی</a><h1>افتخارات فرزانگان شوشتر</h1><p style="font-size:10px;color:#dcefff">افتخارات علمی، قرآنی، فرهنگی، هنری، پژوهشی و کنکوری ۱۴۰۴–۱۴۰۵</p></div></section><main class="wrap section"><div style="background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;margin-bottom:24px"><img src="Assets/porvareshi-1404-1405.jpg" alt="افتخارات پرورشی ۱۴۰۴–۱۴۰۵" style="width:100%;max-height:420px;object-fit:contain;border-radius:16px;cursor:pointer" onclick="openImage(this.src,this.alt)"><div style="text-align:center;font-size:9px;color:var(--muted);padding-top:8px">افتخارات پرورشی ۱۴۰۴–۱۴۰۵</div></div><div class="filters" id="filters"><button class="filter active" data-type="all">همه</button><button class="filter" data-type="قرآنی">قرآن و عترت</button><button class="filter" data-type="علمی">علمی</button><button class="filter" data-type="پژوهشی">پژوهشی</button><button class="filter" data-type="فرهنگی و هنری">فرهنگی و هنری</button><button class="filter" data-type="کنکور">کنکور</button></div><div id="honorGrid" class="honor-grid"></div></main><div id="imageModal" class="modal" onclick="if(event.target===this)closeImage()"><span class="close" onclick="closeImage()">×</span><img id="modalImage"></div><footer><div class="wrap footer-grid"><div><img class="footer-logo" src="Assets/sampad-logo.png"><h3>دبیرستان استعدادهای درخشان شوشتر</h3></div><div><h4>دسترسی</h4><a href="index.html">خانه</a><a href="staff.html">کادر مدرسه</a></div><div><h4>سمپاد</h4><a href="https://sampad.gov.ir/" target="_blank">سامانه رسمی سمپاد</a></div></div><div class="copyright">© دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر</div></footer><script>let items=[];const grid=document.getElementById('honorGrid');function render(type='all'){grid.innerHTML=items.filter(x=>type==='all'||x.type===type).map(x=>`<article class="honor-card"><div class="honor-type">${x.type}</div><h3>${x.title}</h3><div class="honor-meta"><span class="pill">${x.level}</span><span class="pill">${x.year}</span>${x.grade?`<span class="pill">${x.grade}</span>`:''}</div><ul>${x.students.map(s=>`<li>${s}</li>`).join('')}</ul>${x.mentor?`<div class="mentor">استاد راهنما: ${x.mentor}</div>`:''}${x.leader?`<div class="mentor" style="margin-top:6px">سرگروه: ${x.leader}</div>`:''}</article>`).join('')||'<p>موردی برای این دسته ثبت نشده است.</p>'}fetch('data/achievements.json').then(r=>r.json()).then(d=>{items=d;render()});document.getElementById('filters').addEventListener('click',e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.type)});</script><script src="Assets/site.js"></script></body></html>
