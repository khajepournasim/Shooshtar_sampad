<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت دانش‌آموزان | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"></head><body class="auth-page"><main class="auth-card" style="width:min(700px,100%)"><a class="auth-logo" href="index.html"><span><img src="Assets/sampad-logo.png"></span></a><h1>مدیریت اطلاعات دانش‌آموزان</h1><p>فایل CSV دانش‌آموزان را از این بخش به Cloudflare D1 وارد کنید.</p><label style="font-size:9px;font-weight:800">کلید مدیریت</label><input id="key" type="password" placeholder="ADMIN_KEY"><label style="font-size:9px;font-weight:800;margin-top:10px;display:block">فایل CSV</label><input id="file" type="file" accept=".csv" style="margin-top:7px"><button class="btn gold" style="width:100%;margin-top:15px" onclick="upload()">وارد کردن دانش‌آموزان</button><div id="out" class="security-note" style="margin-top:15px"></div><a class="back-link" href="data/students-template.csv">دانلود قالب CSV دانش‌آموزان</a><a class="back-link" href="index.html">← بازگشت به سایت</a></main><script src="Assets/config.js"></script><script>const API=(window.SITE_CONFIG?.API_BASE||'').replace(/\/$/,'');async function upload(){{const f=document.getElementById('file').files[0],key=document.getElementById('key').value,o=document.getElementById('out');if(!f||!key){{o.textContent='کلید مدیریت و فایل CSV را وارد کنید.';return}}const fd=new FormData();fd.append('file',f);o.textContent='در حال وارد کردن...';try{{const r=await fetch(API+'/api/admin/import-students',{{method:'POST',headers:{{'X-Admin-Key':key}},body:fd}});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');o.textContent=`${{d.imported}} دانش‌آموز با موفقیت وارد پایگاه داده شد.`}}catch(e){{o.textContent=e.message}}}}</script></body></html>
