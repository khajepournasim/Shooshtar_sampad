<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود دانش‌آموز | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"><style>
.auth-page{min-height:100vh;background:radial-gradient(circle at 20% 20%,rgba(217,166,58,.12),transparent 25%),radial-gradient(circle at 80% 70%,rgba(30,80,120,.18),transparent 30%),#020a13;display:grid;place-items:center;padding:30px}.auth-card{width:min(460px,100%);background:rgba(6,20,33,.9);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);text-align:center}.auth-logo{width:85px;height:85px;margin:auto}.auth-logo img{width:100%;height:100%;object-fit:contain}.auth-card h1{font-size:24px;margin:12px 0 3px}.auth-card p{font-size:11px;color:var(--muted)}.auth-card form{text-align:right;margin-top:24px}.auth-card label{display:block;font-size:10px;color:var(--gold2);margin:12px 0 6px}.auth-card input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(217,166,58,.3);background:#03101c;color:#fff;outline:none}.auth-card .btn{width:100%;margin-top:16px}.hint{font-size:9px!important;color:#82929b!important;margin-top:16px}.error{color:#ff9a9a;font-size:10px;margin-top:10px;min-height:20px}.back-home{display:inline-block;margin-top:18px;color:var(--gold2);font-size:10px;text-decoration:none}
</style></head><body class="auth-page"><div class="auth-card"><a href="index.html"><div class="auth-logo"><img src="Assets/sampad-logo.png" alt="سمپاد"></div></a><h1>ورود به پنل دانش‌آموزی</h1><p>دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر</p><form id="loginForm"><label for="nationalId">کد ملی</label><input id="nationalId" inputmode="numeric" maxlength="10" placeholder="کد ملی ۱۰ رقمی" required><label for="password">رمز عبور</label><input id="password" type="password" placeholder="رمز عبور" required><button class="btn gold" type="submit">ورود به پنل ←</button><div class="error" id="error"></div></form><p class="hint">نسخه نمایشی: کد ملی ۱۰۰۰۰۰۰۰۰۱ و رمز ۱۲۳۴۵۶ را می‌توانید امتحان کنید. برای استفاده واقعی، احراز هویت باید به سرور امن مدرسه متصل شود.</p><a class="back-home" href="index.html">← بازگشت به سایت</a></div><script>
const form=document.getElementById("loginForm"),err=document.getElementById("error");
function validNationalId(code){if(!/^\d{10}$/.test(code))return false;if(/^(\d)\1{9}$/.test(code))return false;let sum=0;for(let i=0;i<9;i++)sum+=+code[i]*(10-i);let r=sum%11;return r<2?+code[9]===r:+code[9]===11-r}
form.addEventListener("submit",async e=>{e.preventDefault();const id=document.getElementById("nationalId").value.trim(),pw=document.getElementById("password").value;if(!validNationalId(id)){err.textContent="کد ملی از نظر ساختار معتبر نیست.";return}err.textContent="در حال ورود...";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nationalId:id,password:pw})});if(r.ok){const d=await r.json();localStorage.setItem("studentToken",d.token);location.href="student-panel.html";return}}catch(e){}if(id==="1000000001"&&pw==="123456"){localStorage.setItem("studentSession","demo");location.href="student-panel.html"}else{err.textContent="کد ملی یا رمز عبور نادرست است."}});
</script></body></html>
