<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود دانش‌آموز | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"></head><body class="auth-page"><div class="auth-card"><a href="index.html"><div class="auth-logo"><img src="Assets/sampad-logo.png" alt="سمپاد"></div></a><h1>ورود به پنل دانش‌آموزی</h1><p>دبیرستان استعدادهای درخشان دوره دوم شهرستان شوشتر</p><form id="loginForm"><label for="nationalId">کد ملی</label><input id="nationalId" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="کد ملی ۱۰ رقمی" required><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور" required><button class="btn gold" type="submit">ورود به پنل ←</button><div class="error" id="error"></div></form><p class="hint">برای استفاده واقعی، اطلاعات دانش‌آموزان از فایل Excel وارد پایگاه داده می‌شود و رمز عبور به‌صورت امن ذخیره خواهد شد.</p><a href="index.html" style="display:inline-block;margin-top:15px;color:var(--blue);font-size:9px;text-decoration:none">← بازگشت به سایت</a></div><script>const form=document.getElementById('loginForm'),err=document.getElementById('error');function validNationalId(code){if(!/^\d{10}$/.test(code)||/^(\d)\1{9}$/.test(code))return false;let s=0;for(let i=0;i<9;i++)s+=+code[i]*(10-i);const r=s%11;return r<2?+code[9]===r:+code[9]===11-r}form.addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('nationalId').value.trim(),pw=document.getElementById('password').value;if(!validNationalId(id)){err.textContent='کد ملی از نظر ساختار معتبر نیست.';return}err.textContent='در حال ورود...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nationalId:id,password:pw})});const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');localStorage.setItem('studentToken',d.token);location.href='student-panel.html'}catch(x){err.textContent=x.message==='کد ملی یا رمز عبور نادرست است'?'کد ملی یا رمز عبور نادرست است':'ارتباط با سامانه برقرار نشد. اگر سایت فقط روی GitHub Pages است، ابتدا Backend را روی سرور اجرا کنید.'}})</script></body></html>
