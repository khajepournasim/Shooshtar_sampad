<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود دانش‌آموز | سمپاد شوشتر</title><link rel="stylesheet" href="Assets/site.css"></head><body class="auth-page"><div class="auth-orbit"></div><main class="auth-card"><a class="auth-logo" href="index.html"><span><img src="Assets/sampad-logo.png"></span></a><h1>ورود به پنل دانش‌آموزی</h1><p>کد ملی خود را وارد کنید تا داشبورد شخصی شما نمایش داده شود.</p><form id="loginForm"><label for="nationalId">کد ملی</label><input id="nationalId" inputmode="numeric" autocomplete="username" maxlength="10" placeholder="کد ملی ۱۰ رقمی" required><button class="btn gold" type="submit">ورود به پنل ←</button><div class="error" id="error"></div></form><div class="security-note">ورود اصلی از طریق پایگاه داده Cloudflare D1 انجام می‌شود. اطلاعات هر دانش‌آموز فقط پس از احراز هویت از سرور دریافت می‌شود.</div><a class="back-link" href="index.html">← بازگشت به سایت</a></main><script src="Assets/config.js"></script><script>const API=(window.SITE_CONFIG?.API_BASE||'').replace(/\/$/,'');const form=document.getElementById('loginForm'),err=document.getElementById('error');function validNationalId(code){{if(!/^\d{{10}}$/.test(code)||/^(\d)\1{{9}}$/.test(code))return false;let s=0;for(let i=0;i<9;i++)s+=Number(code[i])*(10-i);const r=s%11;return r<2?Number(code[9])===r:Number(code[9])===11-r}}form.onsubmit=async e=>{{e.preventDefault();const id=document.getElementById('nationalId').value.trim();if(!validNationalId(id)){{err.textContent='کد ملی معتبر نیست.';return}}err.textContent='در حال بررسی...';try{{const r=await fetch(API+'/api/auth/login',{{method:'POST',headers:{{'Content-Type':'application/json'}},body:JSON.stringify({{nationalId:id}})}});const d=await r.json();if(!r.ok)throw Error(d.error||'ورود ناموفق بود.');localStorage.setItem('studentToken',d.token);location.href='student-panel.html'}}catch(x){{err.textContent=x.message.includes('پیدا')?'این کد ملی در فهرست دانش‌آموزان ثبت نشده است.':x.message.includes('API')?'سامانه ورود هنوز متصل نشده است.':x.message}}}};</script></body></html>
